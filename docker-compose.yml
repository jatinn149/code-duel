version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - code-duel-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=code_duel
      - POSTGRES_PASSWORD=code_duel
      - POSTGRES_DB=code_duel_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_duel -d code_duel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - code-duel-network

  server:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://code_duel:code_duel@postgres:5432/code_duel_db?schema=public
    networks:
      - code-duel-network

  client:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    networks:
      - code-duel-network

  judge:
    build:
      context: .
      dockerfile: docker/judge.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3002
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    networks:
      - code-duel-network

networks:
  code-duel-network:
    driver: bridge
