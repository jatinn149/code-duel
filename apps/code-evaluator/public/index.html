<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Evaluator Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Monaco Editor AMD Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030303;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="text-neutral-200 min-h-screen flex flex-col justify-between selection:bg-neutral-800">

  <!-- Header -->
  <header class="border-b border-neutral-900 bg-neutral-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center border border-neutral-800">
          <svg class="w-4 h-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
        </div>
        <div>
          <span class="text-xs font-black tracking-[0.2em] text-white block">CODE_EVALUATOR</span>
          <span class="text-[9px] font-mono text-neutral-500 uppercase tracking-widest block -mt-0.5">SANDBOX ENGINE</span>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-[10px] font-mono text-neutral-500 bg-neutral-900 px-3 py-1 rounded-full border border-neutral-800">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>ENGINE ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Code Editor (7 cols) -->
    <div class="lg:col-span-7 flex flex-col space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-400">Write Program</h2>
        <div class="flex items-center space-x-3">
          <label for="language" class="text-xs font-bold text-neutral-500 uppercase">Lang:</label>
          <select id="language" class="bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-1 text-xs text-white font-semibold focus:outline-none focus:border-neutral-700">
            <option value="python">Python 3</option>
            <option value="javascript">JavaScript (Node)</option>
          </select>
        </div>
      </div>

      <!-- Monaco Container -->
      <div class="border border-neutral-900 rounded-xl overflow-hidden bg-neutral-950 flex-1 min-h-[450px] relative shadow-lg">
        <div id="editor-container" class="absolute inset-0"></div>
      </div>
    </div>

    <!-- Right Column: Test Cases (5 cols) -->
    <div class="lg:col-span-5 flex flex-col space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-400">Test Cases</h2>
        <button id="add-testcase-btn" class="bg-neutral-900 hover:bg-neutral-800 text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg border border-neutral-800 hover:border-neutral-700 transition-colors flex items-center space-x-1">
          <span>+ Add Case</span>
        </button>
      </div>

      <!-- Test Cases Container -->
      <div id="testcases-list" class="space-y-4 overflow-y-auto max-h-[450px] pr-2 scrollbar-hide">
        <!-- Default Test Case -->
        <div class="testcase-card bg-neutral-950/50 border border-neutral-900 rounded-xl p-4 space-y-3 relative">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-mono text-neutral-500 uppercase font-black tracking-wider">Test Case #1</span>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1 font-mono">Input (stdin)</label>
              <textarea class="tc-input w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 font-mono focus:outline-none focus:border-neutral-700 resize-none h-16" placeholder="e.g. 2"></textarea>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1 font-mono">Expected Output</label>
              <textarea class="tc-expected w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 font-mono focus:outline-none focus:border-neutral-700 resize-none h-16" placeholder="e.g. 4"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button id="run-btn" class="w-full py-4 bg-white text-black hover:bg-neutral-200 transition-all font-bold uppercase tracking-wider text-xs rounded-xl shadow-lg flex items-center justify-center space-x-2">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
        <span>Execute Code Evaluation</span>
      </button>
    </div>

  </main>

  <!-- Bottom Panel: Results -->
  <section class="max-w-7xl w-full mx-auto px-6 pb-8">
    <div class="border border-neutral-900 rounded-xl bg-neutral-950/40 backdrop-blur-sm overflow-hidden p-6 space-y-4 shadow-xl">
      <h3 class="text-sm font-bold uppercase tracking-wider text-neutral-400 border-b border-neutral-900 pb-3 flex items-center justify-between">
        <span>Execution Diagnostics Terminal</span>
        <span id="overall-badge" class="hidden text-[10px] font-mono font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full"></span>
      </h3>

      <div id="terminal-output" class="font-mono text-xs text-neutral-400 space-y-4">
        <div class="text-neutral-600 italic">No runs executed yet. Write code, add test cases and click Execute.</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-neutral-900 bg-neutral-950/40 py-4 text-center text-[10px] font-mono text-neutral-600 uppercase tracking-widest">
    Code Evaluator Microservice Sandbox Engine &copy; 2026
  </footer>

  <script>
    // Initialize Monaco Editor CDN loading
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });

    let editor;

    const defaultCode = {
      python: `import sys\n\n# Read input from standard input\nfor line in sys.stdin:\n    n = int(line.strip())\n    # Compute output\n    print(n * 2)\n`,
      javascript: `const readline = require('readline');\n\nconst rl = readline.createInterface({\n    input: process.stdin,\n    output: process.stdout,\n    terminal: false\n});\n\nrl.on('line', (line) => {\n    const n = parseInt(line.trim());\n    console.log(n * 2);\n});\n`
    };

    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: defaultCode.python,
        language: 'python',
        theme: 'vs-dark',
        fontFamily: 'JetBrains Mono',
        fontSize: 12,
        minimap: { enabled: false },
        automaticLayout: true,
        scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 },
        lineNumbersMinChars: 3
      });
    });

    // Handle Language change
    document.getElementById('language').addEventListener('change', (e) => {
      const lang = e.target.value;
      if (editor) {
        monaco.editor.setModelLanguage(editor.getModel(), lang);
        editor.setValue(defaultCode[lang]);
      }
    });

    // Handle Adding/Removing Test Cases
    let testCaseCount = 1;
    document.getElementById('add-testcase-btn').addEventListener('click', () => {
      testCaseCount++;
      const list = document.getElementById('testcases-list');
      const card = document.createElement('div');
      card.className = 'testcase-card bg-neutral-950/50 border border-neutral-900 rounded-xl p-4 space-y-3 relative';
      card.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-[10px] font-mono text-neutral-500 uppercase font-black tracking-wider">Test Case #${testCaseCount}</span>
          <button class="remove-btn text-[9px] font-bold text-rose-500 hover:text-rose-450 uppercase tracking-widest font-mono">Remove</button>
        </div>
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1 font-mono">Input (stdin)</label>
            <textarea class="tc-input w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 font-mono focus:outline-none focus:border-neutral-700 resize-none h-16" placeholder="e.g. 5"></textarea>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1 font-mono">Expected Output</label>
            <textarea class="tc-expected w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 font-mono focus:outline-none focus:border-neutral-700 resize-none h-16" placeholder="e.g. 10"></textarea>
          </div>
        </div>
      `;
      list.appendChild(card);
      card.querySelector('.remove-btn').addEventListener('click', () => {
        card.remove();
      });
      list.scrollTop = list.scrollHeight;
    });

    // Handle Evaluation Trigger
    document.getElementById('run-btn').addEventListener('click', async () => {
      if (!editor) return;

      const code = editor.getValue();
      const language = document.getElementById('language').value;
      const cards = document.querySelectorAll('.testcase-card');
      
      const testCases = [];
      cards.forEach(card => {
        const input = card.querySelector('.tc-input').value;
        const expectedOutput = card.querySelector('.tc-expected').value;
        testCases.push({ input, expectedOutput });
      });

      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-black" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Evaluating Sandbox Process...</span>`;

      const terminal = document.getElementById('terminal-output');
      terminal.innerHTML = `<div class="text-neutral-500 animate-pulse">Running evaluation process on backend sandboxes...</div>`;

      try {
        const response = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, language, testCases })
        });
        
        const data = await response.json();
        btn.disabled = false;
        btn.innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg> <span>Execute Code Evaluation</span>`;

        if (!data.success) {
          terminal.innerHTML = `<div class="text-rose-500 font-bold">API ERROR: ${data.error}</div>`;
          return;
        }

        // Render Results
        terminal.innerHTML = '';
        
        const overallBadge = document.getElementById('overall-badge');
        overallBadge.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
        
        if (data.passedCount === data.totalCount) {
          overallBadge.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/20', 'text-emerald-400');
          overallBadge.textContent = 'ALL PASSED';
        } else {
          overallBadge.classList.add('bg-rose-500/10', 'border', 'border-rose-500/20', 'text-rose-400');
          overallBadge.textContent = `${data.passedCount} / ${data.totalCount} PASSED`;
        }
        overallBadge.classList.remove('hidden');

        data.results.forEach(res => {
          const isPassed = res.status === 'PASSED';
          const card = document.createElement('div');
          card.className = `p-4 rounded-lg border ${isPassed ? 'border-neutral-900 bg-neutral-950/20' : 'border-rose-500/20 bg-rose-500/5'} space-y-2`;
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-neutral-300">Case #${res.testCaseIndex + 1}</span>
              <div class="flex items-center space-x-3">
                <span class="text-[9px] font-bold px-2 py-0.5 rounded border ${isPassed ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-rose-500/10 border-rose-500/20 text-rose-400'}">${res.status}</span>
                <span class="text-neutral-500 text-[10px]">${res.timeMs}ms</span>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-[11px] pt-1">
              <div>
                <span class="text-neutral-600 block uppercase font-bold text-[9px] tracking-wider mb-0.5">Input</span>
                <pre class="bg-neutral-900/50 p-2 rounded border border-neutral-900 whitespace-pre-wrap leading-relaxed select-text">${res.input || '[Empty]'}</pre>
              </div>
              <div>
                <span class="text-neutral-600 block uppercase font-bold text-[9px] tracking-wider mb-0.5">Expected Output</span>
                <pre class="bg-neutral-900/50 p-2 rounded border border-neutral-900 whitespace-pre-wrap leading-relaxed select-text">${res.expectedOutput || '[Empty]'}</pre>
              </div>
              <div>
                <span class="text-neutral-600 block uppercase font-bold text-[9px] tracking-wider mb-0.5">Actual Output</span>
                <pre class="bg-neutral-900/50 p-2 rounded border border-neutral-900 whitespace-pre-wrap leading-relaxed select-text">${res.actualOutput || '[Empty]'}</pre>
              </div>
            </div>
            ${res.stderr ? `
              <div class="text-rose-450 pt-1 text-[11px]">
                <span class="text-rose-600 block uppercase font-bold text-[9px] tracking-wider mb-0.5">Standard Error / Stack Trace</span>
                <pre class="bg-rose-500/5 p-2 rounded border border-rose-500/10 whitespace-pre-wrap select-text">${res.stderr}</pre>
              </div>
            ` : ''}
          `;
          terminal.appendChild(card);
        });

      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg> <span>Execute Code Evaluation</span>`;
        terminal.innerHTML = `<div class="text-rose-500 font-bold">NETWORK ERROR: Could not connect to evaluation microservice.</div>`;
      }
    });

  </script>
</body>
</html>
